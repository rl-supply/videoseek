[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "videoseek"
version = "0.1.0"
description = "Cheat-detection video-forensics harness (VideoSeek-based agent)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "decord",
  "litellm",
  "numpy",
  "pillow",
  "pyyaml",
  "requests",
  "yt-dlp",
]

[project.scripts]
"cheatbench-cli" = "videoseek.cli:main"

[tool.setuptools]
packages = { find = { include = ["videoseek*", "config*"] } }
