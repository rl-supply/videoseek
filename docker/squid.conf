# Egress allowlist proxy for isolated cheatbench runs.
# The agent container sits on an internal-only network; this squid is its
# only route out, and only to the destinations below — everything else is
# denied (dns_fail + ERR_ACCESS_DENIED), so no other third-party API can be
# reached from inside the sandbox.

http_port 3128

acl allowed_sites dstdomain api.openrouter.ai
acl allowed_sites dstdomain openrouter.ai
acl allowed_sites dstdomain api.deepgram.com
# video download (yt-dlp): youtube + googlevideo + s3-style hosts
acl allowed_sites dstdomain .youtube.com
acl allowed_sites dstdomain .googlevideo.com
acl allowed_sites dstdomain .ytimg.com
acl allowed_sites dstdomain .amazonaws.com
acl allowed_sites dstdomain .vimeo.com
acl allowed_sites dstdomain .vimeocdn.com

acl CONNECT method CONNECT
acl SSL_ports port 443

http_access allow allowed_sites
http_access deny CONNECT !SSL_ports
http_access deny all

# no caching — every artifact of a run must be fresh
cache deny all
access_log stdio:/dev/stdout
